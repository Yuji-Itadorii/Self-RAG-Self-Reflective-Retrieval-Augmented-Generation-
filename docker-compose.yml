

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: selfrag-db
    environment:
      POSTGRES_USER: selfrag
      POSTGRES_PASSWORD: selfrag
      POSTGRES_DB: selfrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfrag -d selfrag"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
